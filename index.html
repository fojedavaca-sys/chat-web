<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muro de Comunicaciones Público</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 h-screen flex flex-col antialiased">

  <!-- Modal para ingresar el nombre de usuario -->
  <div id="usernameModal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6">
      <h2 class="text-xl font-bold mb-4 text-gray-800">Ingreso al Chat</h2>
      <p class="text-sm text-gray-600 mb-4">Ingresa tu nombre para identificarte en las comunicaciones.</p>
      <form id="usernameForm" onsubmit="setUsername(event)">
        <input 
          type="text" 
          id="usernameInput" 
          placeholder="Nombre o apodo" 
          required
          maxlength="30"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-700 mb-4"
        >
        <button 
          type="submit" 
          class="w-full bg-gray-900 hover:bg-gray-800 text-white font-medium py-2 px-4 rounded-md transition duration-150"
        >
          Entrar
        </button>
      </form>
    </div>
  </div>

  <!-- Encabezado principal -->
  <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shrink-0">
    <div>
      <h1 class="text-lg font-bold text-gray-900">Muro de Comunicaciones</h1>
      <p class="text-xs text-gray-500">Canal público en tiempo real</p>
    </div>
    <div class="text-right">
      <span class="text-xs text-gray-500 block">Usuario actual:</span>
      <span id="currentUserDisplay" class="text-sm font-semibold text-gray-800">No identificado</span>
    </div>
  </header>

  <!-- Área principal del chat -->
  <main id="chatContainer" class="flex-1 overflow-y-auto p-6 space-y-4 max-w-4xl w-full mx-auto">
    <div id="loadingIndicator" class="text-center py-8 text-gray-500">
      Cargando comunicaciones...
    </div>
    <div id="messagesList" class="space-y-4"></div>
  </main>

  <!-- Formulario de envío de mensajes -->
  <footer class="bg-white border-t border-gray-200 p-4 shrink-0">
    <div class="max-w-4xl mx-auto">
      <form id="messageForm" onsubmit="sendMessage(event)" class="flex gap-2">
        <input 
          type="text" 
          id="messageInput" 
          placeholder="Escribe un mensaje..." 
          required
          disabled
          autocomplete="off"
          class="flex-1 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-700 disabled:bg-gray-100 disabled:cursor-not-allowed"
        >
        <button 
          type="submit" 
          id="sendButton"
          disabled
          class="bg-gray-900 hover:bg-gray-800 text-white font-medium px-6 py-2 rounded-md transition duration-150 disabled:bg-gray-400 disabled:cursor-not-allowed"
        >
          Enviar
        </button>
      </form>
    </div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Configuración global e inicialización de Firebase
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'chat-comunicaciones';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
      apiKey: "demo-api-key",
      authDomain: "demo-app.firebaseapp.com",
      projectId: "demo-app",
      storageBucket: "demo-app.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:123456789"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let username = "";

    // Manejo de autenticación básica requerida por la base de datos
    async function initAuth() {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (error) {
        console.error("Error en la autenticación:", error);
      }
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        setupMessagesListener();
      }
    });

    // Guardar el nombre de usuario
    window.setUsername = function(event) {
      event.preventDefault();
      const input = document.getElementById("usernameInput");
      const trimmed = input.value.trim();
      
      if (trimmed.length > 0) {
        username = trimmed;
        document.getElementById("currentUserDisplay").textContent = username;
        document.getElementById("usernameModal").classList.add("hidden");
        document.getElementById("messageInput").disabled = false;
        document.getElementById("sendButton").disabled = false;
        document.getElementById("messageInput").focus();
      }
    };

    // Escuchar mensajes en tiempo real desde la ruta asignada
    function setupMessagesListener() {
      if (!currentUser) return;

      const messagesCollection = collection(db, 'artifacts', appId, 'public', 'data', 'messages');

      onSnapshot(messagesCollection, (snapshot) => {
        const loadingIndicator = document.getElementById("loadingIndicator");
        if (loadingIndicator) {
          loadingIndicator.remove();
        }

        const messagesList = document.getElementById("messagesList");
        
        // Extraer y ordenar los mensajes localmente por fecha de envío
        const messages = [];
        snapshot.forEach((doc) => {
          messages.push({ id: doc.id, ...doc.data() });
        });

        messages.sort((a, b) => {
          const timeA = a.createdAt?.seconds || 0;
          const timeB = b.createdAt?.seconds || 0;
          return timeA - timeB;
        });

        messagesList.innerHTML = "";

        messages.forEach((msg) => {
          const isOwn = msg.sender === username;
          
          const msgContainer = document.createElement("div");
          msgContainer.className = `flex flex-col ${isOwn ? 'items-end' : 'items-start'}`;

          const formattedTime = msg.createdAt ? new Date(msg.createdAt.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '...';

          msgContainer.innerHTML = `
            <div class="flex items-center gap-2 mb-1">
              <span class="text-xs font-medium text-gray-600">${escapeHtml(msg.sender || 'Anónimo')}</span>
              <span class="text-xs text-gray-400">${formattedTime}</span>
            </div>
            <div class="max-w-lg rounded-md px-4 py-2 ${isOwn ? 'bg-gray-900 text-white' : 'bg-white text-gray-800 border border-gray-200'}">
              <p class="text-sm whitespace-pre-wrap break-words">${escapeHtml(msg.text || '')}</p>
            </div>
          `;

          messagesList.appendChild(msgContainer);
        });

        // Desplazar suavemente hasta el último mensaje
        const chatContainer = document.getElementById("chatContainer");
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }, (error) => {
        console.error("Error al obtener mensajes:", error);
      });
    }

    // Enviar un nuevo mensaje a la base de datos
    window.sendMessage = async function(event) {
      event.preventDefault();
      
      const messageInput = document.getElementById("messageInput");
      const text = messageInput.value.trim();

      if (!text || !currentUser || !username) return;

      messageInput.value = "";

      try {
        const messagesCollection = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
        await addDoc(messagesCollection, {
          text: text,
          sender: username,
          userId: currentUser.uid,
          createdAt: serverTimestamp()
        });
      } catch (error) {
        console.error("Error al enviar el mensaje:", error);
      }
    };

    // Función auxiliar para escapar caracteres HTML por seguridad
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
    }

    // Iniciar la autenticación al cargar
    initAuth();
  </script>
</body>
</html>
